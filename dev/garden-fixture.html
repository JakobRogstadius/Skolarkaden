<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/resources/styles.css"><title>Trädgårdens visuella test</title><body><main class="shell"><p>VISUELLT TEST · samma växter, figurer och rendering som i spelet</p><div class="button-row"><button id="states">Visa olika plantskick</button><button id="all">Visa 36 önskemål</button><button id="flowers">Visa blomning</button><button id="celebrate">Testa vinstfirande</button></div><div class="arena garden"><canvas id="fixture-canvas"></canvas><div class="hud"><strong>Odla blommor</strong><strong id="fixture-status">12 krukor</strong></div></div></main><script src="/resources/pinyin.js"></script><script src="/resources/data.js"></script><script src="/resources/speech.js"></script><script src="/resources/input.js"></script><script src="/resources/people.js"></script><script src="/resources/game.js"></script><script src="/resources/plants.js"></script><script src="/resources/garden.js"></script><script>
const SC=Starlight,g=new SC.GardenGame();g.start({pace:'brave',mode:'swedishLong'});g.state='paused';const renderer=new SC.GardenRenderer(document.getElementById('fixture-canvas'),g);
function states(){g.pots.forEach((p,i)=>{Object.assign(p,{growth:.12+(i%7)*.13,moisture:[1,.2,.8,.6,.8,.3,1][i%7],nutrition:[1,.9,.2,.6,.8,.8,1][i%7],infection:[0,0,0,.8,.4,.6,0][i%7],bloom:false,requests:{}});g.syncRequests(p);});document.getElementById('fixture-status').textContent='Olika tillväxt & skötsel';renderer.draw();}
document.getElementById('states').onclick=states;document.getElementById('all').onclick=()=>{g.pots.forEach(p=>{Object.assign(p,{growth:.5,moisture:.4,nutrition:.4,infection:.6,bloom:false,requests:{}});g.syncRequests(p);});document.getElementById('fixture-status').textContent='36 önskemål';renderer.draw();};document.getElementById('flowers').onclick=()=>{g.pots.forEach(p=>Object.assign(p,{growth:1,moisture:1,nutrition:1,infection:0,bloom:true,requests:{}}));document.getElementById('fixture-status').textContent='Alla blommar';renderer.draw();};document.getElementById('celebrate').onclick=()=>{g.pots.forEach(p=>Object.assign(p,{growth:1,bloom:true,requests:{}}));g.state='playing';g.finish(true);};setInterval(()=>{if(g.state==='celebrating')document.getElementById('fixture-status').textContent='Firande: '+g.celebrationLeft.toFixed(1)+' s';else if(g.state==='won')document.getElementById('fixture-status').textContent='Vinstfirandet är klart';},100);states();
</script></body></html>
<script>
const castButton=document.createElement('button');castButton.textContent='Visa alla karaktärstyper';document.querySelector('.button-row').append(castButton);
castButton.onclick=()=>{document.querySelector('.arena').hidden=true;g.state='paused';let grid=document.getElementById('cast-grid');if(grid)grid.remove();grid=document.createElement('div');grid.id='cast-grid';grid.style.cssText='display:grid;grid-template-columns:repeat(4,1fr);gap:15px';
 for(let i=0;i<20;i++){let first=true,state=23+i*521;const random=()=>{state=(Math.imul(state,1664525)+1013904223)>>>0;return state/4294967296;};const look=SC.makePerson(()=>{if(first){first=false;return i<12?[.2,.6,.85,.94][i%4]:.995;}return i<12?random():(i-12+.5)/8;});const card=document.createElement('div');card.style.cssText='background:#35534f;border-radius:14px;text-align:center';const canvas=document.createElement('canvas');canvas.width=200;canvas.height=200;canvas.style.width='100%';const r=Object.create(SC.SceneRenderer.prototype);r.ctx=canvas.getContext('2d');SC.drawPerson(r,{x:100,feet:178,look,scale:1.1});const title=document.createElement('p');title.textContent=look.exotic?SC.rarePeople.find(x=>x.id===look.exotic).name:({man:'Man',woman:'Kvinna',boy:'Pojke',girl:'Flicka'}[look.kind]);card.append(canvas,title);grid.append(card);}document.querySelector('main').append(grid);};
</script>
